<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
<title id="title">How Probara SDK works</title>
<desc id="desc">JUnit XML, Playwright and Jest results go through @probara/cli, @probara/playwright-reporter and @probara/jest-reporter into @probara/core, which builds automation keys, keeps input limits, retries, sends in chunks, shares runs across shards and never logs the token. The result is a Probara run whose cases are matched or created, and which is closed.</desc>
<style>
.label{font:800 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:1.8px;fill:#e4dcfb}
.num{fill:#ffffff}
.title{font:700 19px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ede9f3;letter-spacing:-0.2px}
.sub{font:400 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#a89fb2}
.small{font:400 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#a89fb2}
.pkg{font:700 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#a890e8}
.core{font:800 20px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#a890e8}
.row{font:600 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ede9f3}
.mono{font:500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#a89fb2}
.badge{font:700 12.5px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#120f1a}

@media (prefers-reduced-motion: no-preference) {
  .float { transform-box: fill-box; transform-origin: center; animation: float 5s ease-in-out 1.6s infinite; }
  .flow { animation: flow 1.1s linear infinite; }
}
@keyframes float { 0%, 100% { transform: none; } 50% { transform: translateY(-3px); } }
@keyframes flow { to { stroke-dashoffset: -14; } }
</style>
<defs><clipPath id="frame"><rect width="1200" height="420" rx="24"/></clipPath></defs>
<g clip-path="url(#frame)">
<rect width="1200" height="420" fill="#5a3f9a"/>
<text x="32" y="58" class="label"><tspan class="num">01</tspan>  YOUR TESTS</text><text x="298" y="58" class="label"><tspan class="num">02</tspan>  ADAPTERS</text><text x="634" y="58" class="label"><tspan class="num">03</tspan>  CORE</text><text x="914" y="58" class="label"><tspan class="num">04</tspan>  PROBARA</text>
<g><path d="M268 124H288" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><path d="M280 116l8 8 -8 8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M268 223H288" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><path d="M280 215l8 8 -8 8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M268 322H288" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><path d="M280 314l8 8 -8 8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M598 124C624 124 592 223 622 223" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><path d="M598 223C624 223 592 223 622 223" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><path d="M598 322C624 322 592 223 622 223" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><path d="M614 215l8 8 -8 8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g><rect x="38" y="90" width="222" height="80" rx="8" fill="#120f1a"/><rect x="32" y="84" width="222" height="80" rx="8" fill="#2b2934" stroke="#4f4a5c" stroke-width="1.25"/><circle cx="54" cy="106" r="3.2" fill="#5fb37a"/><text x="66" y="113" class="title">JUnit XML</text><text x="52" y="140" class="sub">pytest, Maven, Go and more</text></g><g><rect x="38" y="189" width="222" height="80" rx="8" fill="#120f1a"/><rect x="32" y="183" width="222" height="80" rx="8" fill="#2b2934" stroke="#4f4a5c" stroke-width="1.25"/><circle cx="54" cy="205" r="3.2" fill="#7d8ff0"/><text x="66" y="212" class="title">Playwright</text><text x="52" y="239" class="sub">@playwright/test 1.42+</text></g><g><rect x="38" y="288" width="222" height="80" rx="8" fill="#120f1a"/><rect x="32" y="282" width="222" height="80" rx="8" fill="#2b2934" stroke="#4f4a5c" stroke-width="1.25"/><circle cx="54" cy="304" r="3.2" fill="#d6b25a"/><text x="66" y="311" class="title">Jest</text><text x="52" y="338" class="sub">Jest 29.6 or later</text></g><g><rect x="304" y="90" width="286" height="80" rx="8" fill="#120f1a"/><rect x="298" y="84" width="286" height="80" rx="8" fill="#2b2934" stroke="#4f4a5c" stroke-width="1.25"/><text x="318" y="117" class="pkg">@probara/cli</text><text x="318" y="142" class="sub">probara import junit</text></g><g><rect x="304" y="189" width="286" height="80" rx="8" fill="#120f1a"/><rect x="298" y="183" width="286" height="80" rx="8" fill="#2b2934" stroke="#4f4a5c" stroke-width="1.25"/><text x="318" y="216" class="pkg">@probara/playwright-reporter</text><text x="318" y="241" class="sub">every attempt, steps, files</text></g><g><rect x="304" y="288" width="286" height="80" rx="8" fill="#120f1a"/><rect x="298" y="282" width="286" height="80" rx="8" fill="#2b2934" stroke="#4f4a5c" stroke-width="1.25"/><text x="318" y="315" class="pkg">@probara/jest-reporter</text><text x="318" y="340" class="sub">every attempt, steps, files</text></g>
<g><rect x="642" y="92" width="236" height="278" rx="12" fill="#120f1a"/><rect x="634" y="84" width="236" height="278" rx="12" fill="#3a3150" stroke="#4f4a5c" stroke-width="1.25"/><circle cx="656" cy="106" r="3.2" fill="#a890e8"/><circle cx="666" cy="106" r="3.2" fill="#a890e8"/><circle cx="676" cy="106" r="3.2" fill="#a890e8"/><text x="654" y="142" class="core">@probara/core</text><text x="654" y="166" class="sub">one engine, every adapter</text><path d="M654 184H850" stroke="#4f4a5c" stroke-width="1.5"/><circle cx="664" cy="208" r="8" fill="#5fb37a"/><path pathLength="1" d="M660.48 208l2.5600000000000005 2.5600000000000005 4.800000000000001 -5.120000000000001" fill="none" stroke="#2b2934" stroke-width="1.9200000000000004" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="213" class="row">Automation keys</text><circle cx="664" cy="235" r="8" fill="#7d8ff0"/><path pathLength="1" d="M660.48 235l2.5600000000000005 2.5600000000000005 4.800000000000001 -5.120000000000001" fill="none" stroke="#2b2934" stroke-width="1.9200000000000004" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="240" class="row">Input limits</text><circle cx="664" cy="262" r="8" fill="#d6b25a"/><path pathLength="1" d="M660.48 262l2.5600000000000005 2.5600000000000005 4.800000000000001 -5.120000000000001" fill="none" stroke="#2b2934" stroke-width="1.9200000000000004" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="267" class="row">Retries and rate limits</text><circle cx="664" cy="289" r="8" fill="#5fb37a"/><path pathLength="1" d="M660.48 289l2.5600000000000005 2.5600000000000005 4.800000000000001 -5.120000000000001" fill="none" stroke="#2b2934" stroke-width="1.9200000000000004" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="294" class="row">Chunked sending</text><circle cx="664" cy="316" r="8" fill="#7d8ff0"/><path pathLength="1" d="M660.48 316l2.5600000000000005 2.5600000000000005 4.800000000000001 -5.120000000000001" fill="none" stroke="#2b2934" stroke-width="1.9200000000000004" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="321" class="row">Shared runs for shards</text><circle cx="664" cy="343" r="8" fill="#d6b25a"/><path pathLength="1" d="M660.48 343l2.5600000000000005 2.5600000000000005 4.800000000000001 -5.120000000000001" fill="none" stroke="#2b2934" stroke-width="1.9200000000000004" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="348" class="row">Token never logged</text></g>
<g><path class="flow" d="M886 223H900" stroke="#ffffff" stroke-width="3.5" stroke-dasharray="7 7" stroke-linecap="round"/><path d="M894 215l8 8 -8 8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g><g class="float"><rect x="920" y="90" width="246" height="278" rx="8" fill="#120f1a"/><rect x="914" y="84" width="246" height="278" rx="8" fill="#2b2934" stroke="#4f4a5c" stroke-width="1.25"/><text x="934" y="118" class="title">Probara run</text><text x="934" y="142" class="mono">R-1 · SHOP</text><rect x="934" y="158" width="206" height="10" rx="5" fill="#4f4a5c"/><path d="M939 158h139.2v10h-139.2a5 5 0 0 1 0 -10Z" fill="#5fb37a"/><rect x="1078.2" y="158" width="41.2" height="10" fill="#d96f6f"/><circle cx="944" cy="206" r="8" fill="#5fb37a"/><path pathLength="1" d="M940.48 206l2.5600000000000005 2.5600000000000005 4.800000000000001 -5.120000000000001" fill="none" stroke="#2b2934" stroke-width="1.9200000000000004" stroke-linecap="round" stroke-linejoin="round"/><text x="962" y="211" class="row">Cases matched</text><text x="962" y="232" class="small">by automation key or case id</text><circle cx="944" cy="260" r="8" fill="#7d8ff0"/><path pathLength="1" d="M940.48 260l2.5600000000000005 2.5600000000000005 4.800000000000001 -5.120000000000001" fill="none" stroke="#2b2934" stroke-width="1.9200000000000004" stroke-linecap="round" stroke-linejoin="round"/><text x="962" y="265" class="row">Missing cases created</text><text x="962" y="286" class="small">with their suite and title</text><circle cx="944" cy="314" r="8" fill="#d6b25a"/><path pathLength="1" d="M940.48 314l2.5600000000000005 2.5600000000000005 4.800000000000001 -5.120000000000001" fill="none" stroke="#2b2934" stroke-width="1.9200000000000004" stroke-linecap="round" stroke-linejoin="round"/><text x="962" y="319" class="row">Run closed</text><text x="962" y="340" class="small">with a link in the log</text><g><rect x="1079" y="101" width="66" height="26" rx="13" fill="#120f1a"/><rect x="1076" y="98" width="66" height="26" rx="13" fill="#5fb37a"/><text x="1109" y="115.5" text-anchor="middle" class="badge">closed</text></g></g></g>
</g>
</svg>
