<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="title desc">
<title id="title">How the Probara SDK works</title>
<desc id="desc">JUnit XML, Playwright and Jest results go through their adapters, @probara/cli, @probara/playwright-reporter and @probara/jest-reporter, into @probara/core, which builds automation keys, keeps input inside the API limits, retries, sends in chunks and shares runs across shards, and they land in a Probara run whose cases are matched or created and which is closed.</desc>
<style>
.label{font:700 12.5px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;letter-spacing:1.6px;fill:#6e7288}
.num{fill:#5b3fd6}
.ctitle{font:650 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#171a2b;letter-spacing:-0.2px}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:14.5px;font-weight:600;letter-spacing:0;fill:#4b2fc4}
.csub{font:400 13.5px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#6e7288}
.csub.mono{font:500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#6e7288}
.coreTitle{font:700 19px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#ffffff}
.coreSub{font:400 13.5px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ede8ff}
.coreItem{font:500 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ffffff}
.ritem{font:600 14.5px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#171a2b}
.badge{font:600 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#16a36a}
.arrow{fill:none;stroke:#b7a9f0;stroke-width:2;stroke-linecap:round}
.arrow.strong{stroke:#5b3fd6;stroke-width:2.5}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaff"/><stop offset="1" stop-color="#f1eefc"/></linearGradient>
<linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a4ee0"/><stop offset="1" stop-color="#4b2fc4"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#5b3fd6"/></pattern>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#5b3fd6" flood-opacity="0.08"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#b7a9f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="headStrong" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#5b3fd6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="440" fill="url(#bg)"/>
<rect width="1200" height="440" fill="url(#dots)" opacity="0.11199999999999999"/>
<text x="40" y="70" class="label"><tspan class="num">01</tspan>  YOUR TESTS</text><text x="290" y="70" class="label"><tspan class="num">02</tspan>  ADAPTERS</text><text x="630" y="70" class="label"><tspan class="num">03</tspan>  CORE</text><text x="920" y="70" class="label"><tspan class="num">04</tspan>  PROBARA</text>
<path d="M256 146 H280" class="arrow" marker-end="url(#head)"/><path d="M256 256 H280" class="arrow" marker-end="url(#head)"/><path d="M256 366 H280" class="arrow" marker-end="url(#head)"/><path d="M586 146 C603 146 603 256 620 256" class="arrow" marker-end="url(#head)"/><path d="M586 256 C603 256 603 256 620 256" class="arrow" marker-end="url(#head)"/><path d="M586 366 C603 366 603 256 620 256" class="arrow" marker-end="url(#head)"/><path d="M876 256 H910" class="arrow strong" marker-end="url(#headStrong)"/>
<g transform="translate(40 104)"><rect width="210" height="84" rx="14" fill="#ffffff" stroke="#e4def9" filter="url(#shadow)"/><text x="18" y="38" class="ctitle">JUnit XML</text><text x="18" y="60" class="csub">pytest, Maven, Go and more</text></g><g transform="translate(40 214)"><rect width="210" height="84" rx="14" fill="#ffffff" stroke="#e4def9" filter="url(#shadow)"/><text x="18" y="38" class="ctitle">Playwright</text><text x="18" y="60" class="csub">@playwright/test 1.42+</text></g><g transform="translate(40 324)"><rect width="210" height="84" rx="14" fill="#ffffff" stroke="#e4def9" filter="url(#shadow)"/><text x="18" y="38" class="ctitle">Jest</text><text x="18" y="60" class="csub">Jest 29.6 or later</text></g><g transform="translate(290 104)"><rect width="290" height="84" rx="14" fill="#ffffff" stroke="#e4def9" filter="url(#shadow)"/><text x="18" y="38" class="ctitle mono">@probara/cli</text><text x="18" y="60" class="csub">probara import junit</text></g><g transform="translate(290 214)"><rect width="290" height="84" rx="14" fill="#ffffff" stroke="#e4def9" filter="url(#shadow)"/><text x="18" y="38" class="ctitle mono">@probara/playwright-reporter</text><text x="18" y="60" class="csub">every attempt, steps, files</text></g><g transform="translate(290 324)"><rect width="290" height="84" rx="14" fill="#ffffff" stroke="#e4def9" filter="url(#shadow)"/><text x="18" y="38" class="ctitle mono">@probara/jest-reporter</text><text x="18" y="60" class="csub">every attempt, steps, files</text></g>
<g transform="translate(630 104)"><rect width="240" height="304" rx="16" fill="url(#coreGrad)" filter="url(#shadow)"/><text x="20" y="40" class="coreTitle">@probara/core</text><text x="20" y="62" class="coreSub">one engine, every adapter</text><rect x="20" y="78" width="200" height="1" fill="#ede8ff" opacity="0.35"/><g transform="translate(20 106)"><circle cx="6" cy="-5" r="3.5" fill="#ede8ff"/><text x="20" y="0" class="coreItem">Automation keys</text></g><g transform="translate(20 138)"><circle cx="6" cy="-5" r="3.5" fill="#ede8ff"/><text x="20" y="0" class="coreItem">Input limits</text></g><g transform="translate(20 170)"><circle cx="6" cy="-5" r="3.5" fill="#ede8ff"/><text x="20" y="0" class="coreItem">Retries and rate limits</text></g><g transform="translate(20 202)"><circle cx="6" cy="-5" r="3.5" fill="#ede8ff"/><text x="20" y="0" class="coreItem">Chunked sending</text></g><g transform="translate(20 234)"><circle cx="6" cy="-5" r="3.5" fill="#ede8ff"/><text x="20" y="0" class="coreItem">Shared runs for shards</text></g><g transform="translate(20 266)"><circle cx="6" cy="-5" r="3.5" fill="#ede8ff"/><text x="20" y="0" class="coreItem">Token never logged</text></g></g>
<g transform="translate(920 104)"><rect width="240" height="304" rx="16" fill="#ffffff" stroke="#e4def9" filter="url(#shadow)"/><text x="20" y="40" class="ctitle">Probara run</text><g transform="translate(148 23)"><rect width="72" height="24" rx="12" fill="#16a36a" opacity="0.15"/><circle cx="14" cy="12" r="4" fill="#16a36a"/><text x="24" y="16.5" class="badge">closed</text></g><text x="20" y="62" class="csub mono">R-1 · SHOP</text><g transform="translate(20 80)"><rect width="200" height="8" rx="4" fill="#e4def9"/><rect width="140.0" height="8" rx="4" fill="#16a36a"/><rect x="140.0" width="40.0" height="8" fill="#e0475b"/></g><g transform="translate(20 130)"><circle cx="9" cy="-5" r="9" fill="#5b3fd6" opacity="0.14"/><path d="M5 -5 l3 3 l5 -6" fill="none" stroke="#5b3fd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="0" class="ritem">Cases matched</text><text x="26" y="20" class="csub">by automation key or case id</text></g><g transform="translate(20 188)"><circle cx="9" cy="-5" r="9" fill="#5b3fd6" opacity="0.14"/><path d="M5 -5 l3 3 l5 -6" fill="none" stroke="#5b3fd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="0" class="ritem">Missing cases created</text><text x="26" y="20" class="csub">with their suite and title</text></g><g transform="translate(20 246)"><circle cx="9" cy="-5" r="9" fill="#5b3fd6" opacity="0.14"/><path d="M5 -5 l3 3 l5 -6" fill="none" stroke="#5b3fd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="0" class="ritem">Run closed</text><text x="26" y="20" class="csub">with a link in the log</text></g></g>
</g>
<rect x="0.5" y="0.5" width="1199" height="439" rx="23.5" fill="none" stroke="#e4def9"/>
</svg>
