name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # The browser tests of the Vitest reporter launch Playwright's headless Chromium.
      - run: pnpm --filter @probara/vitest-reporter exec playwright install --with-deps chromium-headless-shell
      - run: pnpm --filter @probara/cypress-reporter exec cypress install
      - run: pnpm test
      - run: pnpm build
