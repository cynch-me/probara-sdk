name: CI

# The checks run once per change, on its pull request; the `main` ruleset requires `CI OK` before a
# merge, so the release workflow on `main` does not run them again. The "chore: version packages"
# pull request skips every job: it only bumps versions, writes changelogs and regenerates each
# `src/version.ts`, which the release build regenerates and compiles again before it publishes. A
# job skipped by its `if` counts as passed for a required check.
on:
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the checks still running for the one before it.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Formatting, lint, types and the build do not depend on the Node version: once, on the newest.
  static:
    name: format, lint, typecheck, build
    if: github.head_ref != 'changeset-release/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  # The tests, on every supported Node version, in two shards that run side by side. The end-to-end
  # tests of the reporters run the real test frameworks and take most of the time: Cypress,
  # Playwright and Cucumber in one shard, everything else (Jest, Vitest, the CLI, core, Vis) in the
  # other, so a new package always lands somewhere. The packages of a shard start at once
  # (`--no-sort`): their tests build what they need themselves, one process at a time.
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.shard.name }})
    if: github.head_ref != 'changeset-release/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      # A failing shard leaves the others running: re-running the failed jobs then runs that one only.
      fail-fast: false
      matrix:
        node: [22, 24]
        shard:
          - name: cypress, playwright, cucumber
            filter: >-
              --filter @probara/cypress-reporter --filter @probara/playwright-reporter
              --filter @probara/cucumber-reporter
            cypress: true
          - name: the rest
            filter: >-
              --filter !@probara/cypress-reporter --filter !@probara/playwright-reporter
              --filter !@probara/cucumber-reporter
            chromium: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser tests of the Vitest reporter and of Vis launch Playwright's headless Chromium.
      - if: matrix.shard.chromium
        run: pnpm --filter @probara/vitest-reporter exec playwright install --with-deps chromium-headless-shell
      - if: matrix.shard.cypress
        run: pnpm --filter @probara/cypress-reporter exec cypress install
      # One X display for every `cypress run`: without it, each starts its own Xvfb on :99, and the
      # runs of test files running at the same time fail with "Display :99 is already in use".
      # Each package also writes a blob report (`.vitest/blob`) for the step after.
      - if: matrix.shard.cypress
        run: xvfb-run --auto-servernum pnpm --no-sort ${{ matrix.shard.filter }} test --reporter=default --reporter=blob
      - if: ${{ !matrix.shard.cypress }}
        run: pnpm --no-sort ${{ matrix.shard.filter }} test --reporter=default --reporter=blob
      # The SDK reports its own tests to Probara (project PSDK) with its own Vitest reporter, built
      # from this change. The tests above ran without the token, so no test of a reporter can send
      # to the real Probara by mistake: only this merge of their blob reports holds it. On Node 24
      # only, so a test is not recorded twice; even after a failure, as failures are what a run is
      # for. Every job of the workflow run reports into one run, which the `probara` job closes.
      - name: Report to Probara
        if: ${{ !cancelled() && matrix.node == 24 }}
        env:
          PROBARA_API_TOKEN: ${{ secrets.PROBARA_API_TOKEN }}
          PROBARA_CLOSE_RUN: 'false'
        run: |
          pnpm --filter "@probara/vitest-reporter..." build
          pnpm -r --no-bail --no-sort ${{ matrix.shard.filter }} exec vitest --merge-reports .vitest/blob --config ../../vitest.probara.js

  # Closes the Probara run every test job reported into, once the last one ended. Not a need of
  # `CI OK`: reporting never decides a merge. Without the token (a pull request from a fork),
  # nothing was reported and there is nothing to close.
  probara:
    name: close the Probara run
    if: ${{ !cancelled() && github.head_ref != 'changeset-release/main' }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROBARA_API_TOKEN: ${{ secrets.PROBARA_API_TOKEN }}
      PROBARA_PROJECT: PSDK
    steps:
      - if: env.PROBARA_API_TOKEN != ''
        run: npx --yes @probara/cli@0 run close

  # The one check the `main` ruleset requires, so a change to the jobs or the matrix above never
  # needs a change to the ruleset. It fails when any job above failed or was cancelled.
  ci-ok:
    name: CI OK
    if: always() && github.head_ref != 'changeset-release/main'
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo 'Every CI job passed.'
